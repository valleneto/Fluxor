name: Fluxor MVP checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall -q fluxor_core tests
      - name: Classifier
        run: python -m tests.test_classifier
      - name: Organizer on isolated sandbox
        run: python -m tests.test_organizer
      - name: Scanner
        run: python -m tests.test_scanner
      - name: Safety regression
        run: python -m tests.test_seguranca
